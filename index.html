<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Distance Tracker</title>
  <style>
    /* Reset & Base Layout Styles */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    /* Logo & Header Structure */
    .app-header {
      display: flex;
      flex-direction: column; /* Stacks logo cleanly on top of text */
      align-items: center;    /* Center justifies everything horizontally */
      text-align: center;
      margin-bottom: 25px;
      width: 100%;
      max-width: 500px;
    }

    .app-logo {
      max-width: 150px;       /* Keeps the logo a clean, readable size */
      height: auto;           /* Prevents stretching or distortion */
      margin-bottom: 12px;    /* Adds even spacing before text starts */
    }

    .app-header h1 {
      font-size: 26px;
      font-weight: 800;
      letter-spacing: 1px;
      color: #1a1a1a;
    }

    /* Main Distance Tracker UI Elements */
    .tracker-card {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      width: 100%;
      max-width: 500px;
      padding: 25px;
      margin-bottom: 20px;
    }

    .stats-container {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-bottom: 25px;
    }

    .stat-box {
      background-color: #f8f9fa;
      border-radius: 15px;
      padding: 15px;
      text-align: center;
      border: 1px solid #eef1f6;
    }

    .stat-label {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: #888;
      margin-bottom: 5px;
    }

    .stat-value {
      font-size: 24px;
      font-weight: 700;
      color: #2c3e50;
    }

    .control-btn {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 15px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .btn-start {
      background-color: #27ae60;
      color: white;
    }

    .btn-start:hover {
      background-color: #219653;
    }

    .btn-stop {
      background-color: #e74c3c;
      color: white;
      display: none;
    }

    .map-placeholder {
      background-color: #eef1f6;
      border: 2px dashed #cbd5e1;
      border-radius: 15px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #64748b;
      font-size: 14px;
      margin-top: 20px;
    }
  </style>
</head>
<body>

    <!-- The App Header (Centered Logo + Title Below It) -->
  <header class="app-header">
    <img src="Gen X Logo White_for embroidery.png" alt="App Logo" class="app-logo">
    <h1>DISTANCE TRACKER</h1>
  </header>

  <!-- Main Tracking Interface Box -->
  <main class="tracker-card">
    <div class="stats-container">
      <div class="stat-box">
        <p class="stat-label">Total Distance</p>
        <p class="stat-value" id="distance-display">0.00 mi</p>
      </div>
      <div class="stat-box">
        <p class="stat-label">Time Elapsed</p>
        <p class="stat-value" id="time-display">00:00</p>
      </div>
    </div>

    <!-- Active Action Buttons -->
    <button class="control-btn btn-start" id="start-btn">Start Tracking</button>
    <button class="control-btn btn-stop" id="stop-btn">Stop Tracking</button>

    <!-- Location Feed Tracker Layout -->
    <div class="map-placeholder" id="status-feed">
      GPS Signal Ready • Awaiting Start
    </div>
  </main>

  <script>
    // Basic structural framework for your tracker events
    const startBtn = document.getElementById('start-btn');
    const stopBtn = document.getElementById('stop-btn');
    const statusFeed = document.getElementById('status-feed');
    let trackingInterval;
    let seconds = 0;

    startBtn.addEventListener('click', () => {
      startBtn.style.display = 'none';
      stopBtn.style.display = 'block';
      statusFeed.innerText = "Tracking active... monitoring device coordinates.";
      statusFeed.style.borderColor = "#27ae60";
      
      trackingInterval = setInterval(() => {
        seconds++;
        let mins = Math.floor(seconds / 60).toString().padStart(2, '0');
        let secs = (seconds % 60).toString().padStart(2, '0');
        document.getElementById('time-display').innerText = `${mins}:${secs}`;
      }, 1000);
    });

    stopBtn.addEventListener('click', () => {
      clearInterval(trackingInterval);
      stopBtn.style.display = 'none';
      startBtn.style.display = 'block';
      statusFeed.innerText = "Tracking paused. Session distance calculated.";
      statusFeed.style.borderColor = "#cbd5e1";
    });
  </script>

</body>
</html>
